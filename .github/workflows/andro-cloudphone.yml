name: AndroCloud Phone (Android 16 // Linux // 2026)

run-name: "Android16 CloudPhone Linux // run ${{ github.run_number }}"

on:
  workflow_dispatch:
    inputs:
      auth_username:
        description: "Phone access username (empty = TEMPORARY random)"
        required: false
        default: ""
      auth_password:
        description: "Phone access password (empty = TEMPORARY random)"
        required: false
        default: ""
      ngrok_authtoken:
        description: "ngrok authtoken (empty = repo secret NGROK_AUTHTOKEN)"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: andro-cloud-lin-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  cloudphone:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      ENABLE_CF: "1"
      ENABLE_NGROK: "0"
      ANDRO_IMG: "system-images;android-36;google_apis_playstore;x86_64"
      ANDRO_MAXSIZE: "0"
      ANDRO_BITRATE: "20000000"
      ANDRO_FPS: "60"
      ANDRO_RAMMB: "auto"
    steps:
      - name: "0/9 Preflight + KVM check"
        run: |
          set -Eeuo pipefail
          echo "::notice::ANDRO CLOUD v2026.3.0 // Android 16 Cloud Phone // Linux host"
          echo "runner: $RUNNER_NAME | $(uname -m)"
          RAM="$(awk '/MemTotal/ {print int($2/1024)}' /proc/meminfo)"
          CORES="$(nproc)"
          DISK="$(df -BG / | tail -1 | awk '{print int($4)}' | tr -d 'G')"
          echo "RAM=$RAM MB cores=$CORES disk=$DISK GB"
          {
            echo "RAMMB=$RAM"
            echo "CORES=$CORES"
            echo "DISKGB=$DISK"
          } >> "$GITHUB_ENV"
          if [ ! -e /dev/kvm ]; then
            echo "::error::/dev/kvm NHI MILA - Android emulator ke liye KVM zaroori hai. Linux VPS pe nested virtualization on karo, ya Windows host mode use karo, ya GitHub pe PUBLIC repo try karo (hosted runners pe KVM hota hai)."
            exit 1
          fi
          ls -la /dev/kvm
          sudo -n true 2>/dev/null && echo "sudo: ok" || echo "sudo: not available (root chal rahe ho to ok)"
          mkdir -p /tmp/andro

      - name: "1/9 JDK 17 (sdkmanager ke liye)"
        run: |
          set -Eeuo pipefail
          if command -v java >/dev/null 2>&1; then
            JV="$(java -version 2>&1 | head -1)"
            echo "java found: $JV"
            if printf '%s' "$JV" | grep -qE 'version "(1[7-9]|2[0-9])'; then
              echo "::notice::existing java 17+ use hoga"
              exit 0
            fi
          fi
          if command -v apt-get >/dev/null 2>&1; then
            SUDO=""
            if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
            $SUDO apt-get update -qq || true
            $SUDO DEBIAN_FRONTEND=noninteractive apt-get install -y -qq openjdk-17-jdk-headless > /tmp/jdk.log 2>&1 || {
              echo "::warning::apt jdk failed - temurin zip try karenge"; tail -20 /tmp/jdk.log || true;
              curl -fsSL --retry 3 -o /tmp/jdk.tgz "https://api.adoptium.net/v3/binary/latest/17/ga/linux/x64/jdk/hotspot/normal/eclipse"
              mkdir -p "$HOME/jdk17" && tar -xzf /tmp/jdk.tgz -C "$HOME/jdk17" --strip-components=1
              echo "JAVA_HOME=$HOME/jdk17" >> "$GITHUB_ENV"
              echo "$HOME/jdk17/bin" >> "$GITHUB_PATH"
              exit 0
            }
            JH="$(dirname "$(dirname "$(readlink -f "$(command -v java)")")")"
            echo "JAVA_HOME=$JH" >> "$GITHUB_ENV"
          else
            echo "::error::apt-get nahi mila - JDK 17 manually install karo"
            exit 1
          fi
          java -version

      - name: "2/9 Node.js 22"
        run: |
          set -Eeuo pipefail
          if command -v node >/dev/null 2>&1; then
            echo "node already: $(node --version)"
            exit 0
          fi
          curl -fsSL --retry 3 -o /tmp/node.tar.xz "https://nodejs.org/dist/v22.14.0/node-v22.14.0-linux-x64.tar.xz"
          mkdir -p "$HOME/noded" && tar -xJf /tmp/node.tar.xz -C "$HOME/noded" --strip-components=1
          echo "$HOME/noded/bin" >> "$GITHUB_PATH"

      - name: "3/9 Android SDK + Android 16 Official Image"
        run: |
          set -Eeuo pipefail
          if [ ! -f /tmp/andro/sdk/cmdline-tools/latest/bin/sdkmanager ]; then
            echo "Downloading Android cmdline-tools..."
            curl -fsSL --retry 3 -o /tmp/andro/ct.zip "https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip"
            mkdir -p /tmp/andro/sdk/cmdline-tools
            unzip -q -o /tmp/andro/ct.zip -d /tmp/andro/sdktmp
            mv /tmp/andro/sdktmp/cmdline-tools /tmp/andro/sdk/cmdline-tools/latest
          fi
          SDKM="/tmp/andro/sdk/cmdline-tools/latest/bin/sdkmanager"
          echo "Accepting licenses..."
          yes | "$SDKM" --sdk_root=/tmp/andro/sdk --licenses > /dev/null 2>&1 || true
          echo "Installing platform-tools + emulator + Android 16 image (1.5-2GB, 2-6 min)..."
          "$SDKM" --sdk_root=/tmp/andro/sdk "platform-tools" "emulator" "$ANDRO_IMG" || {
            echo "::warning::Primary image failed - trying Google APIs variant"
            ALT="$(printf '%s' "$ANDRO_IMG" | sed 's/_playstore//')"
            "$SDKM" --sdk_root=/tmp/andro/sdk "platform-tools" "emulator" "$ALT"
            echo "ANDRO_IMG=$ALT" >> "$GITHUB_ENV"
          }
          {
            echo "ANDROID_HOME=/tmp/andro/sdk"
            echo "ANDROID_SDK_ROOT=/tmp/andro/sdk"
          } >> "$GITHUB_ENV"
          echo "/tmp/andro/sdk/platform-tools" >> "$GITHUB_PATH"
          echo "/tmp/andro/sdk/emulator" >> "$GITHUB_PATH"
          /tmp/andro/sdk/platform-tools/adb --version | head -1

      - name: "4/9 KVM permissions"
        run: |
          set -Eeuo pipefail
          ls -la /dev/kvm
          SUDO=""
          if [ "$(id -u)" != "0" ]; then SUDO="sudo"; fi
          $SUDO chmod 666 /dev/kvm 2>/dev/null || $SUDO usermod -aG kvm "$USER" 2>/dev/null || true
          ls -la /dev/kvm
          echo "::notice::KVM ready"

      - name: "5/9 AVD Create (full RAM + sparse 192G storage) + AVD Doctor"
        run: |
          set -Eeuo pipefail
          AVDM="/tmp/andro/sdk/cmdline-tools/latest/bin/avdmanager"
          echo "=== AVD DOCTOR (androv3 diagnostics) ==="
          java -version 2>&1 | head -1 || true
          "$AVDM" --version 2>&1 | head -2 || true
          df -BG / | tail -1 || true
          echo "installed system images:"
          ls /tmp/andro/sdk/system-images/ 2>/dev/null || true
          ls /tmp/andro/sdk/system-images/*/*/*/ 2>/dev/null | head -6 || true
          echo "=== avdmanager create avd ==="
          if echo no | "$AVDM" create avd -n cloudphone -k "$ANDRO_IMG" --force > /tmp/andro/avd.log 2>&1; then
            AVDRC=0
            echo "::notice title=androv3::avdmode=avdmanager"
          else
            AVDRC=$?
            echo "::warning::avdmanager create failed (exit $AVDRC) - HAND-CRAFTED AVD FALLBACK start"
            tail -30 /tmp/andro/avd.log || true
          fi
          CFG="$HOME/.android/avd/cloudphone.avd/config.ini"
          if [ ! -f "$CFG" ]; then CFG="$(find "$HOME/.android" -name config.ini -path '*cloudphone*' 2>/dev/null | head -1)"; fi
          if [ ! -f "$CFG" ]; then
            echo "hand-crafted AVD fallback (avdmanager bypass)..."
            AVDDIR="$HOME/.android/avd/cloudphone.avd"
            mkdir -p "$AVDDIR"
            IMGREL="$(echo "$ANDRO_IMG" | tr ';' '/')"
            if [ ! -d "/tmp/andro/sdk/system-images/$IMGREL" ]; then
              FOUND="$(find /tmp/andro/sdk/system-images -mindepth 4 -maxdepth 4 -type d 2>/dev/null | head -1 || true)"
              if [ -n "$FOUND" ]; then
                IMGREL="$(printf '%s' "$FOUND" | sed 's#^/tmp/andro/sdk/system-images/##')"
              fi
            fi
            TAGID="$(printf '%s' "$IMGREL" | cut -d/ -f3)"
            {
              echo "avd.ini.encoding=UTF-8"
              echo "path=$AVDDIR"
              echo "path.rel=avd/cloudphone.avd"
            } > "$HOME/.android/avd/cloudphone.ini"
            {
              echo "avd.ini.encoding=UTF-8"
              echo "hw.cpu.arch=x86_64"
              echo "abi.type=x86_64"
              echo "hw.cpu.ncore=2"
              echo "hw.ramSize=2048"
              echo "image.sysdir.1=system-images/$IMGREL/"
              echo "tag.id=$TAGID"
              echo "image.androidVersion.api=36"
              echo "hw.lcd.width=1080"
              echo "hw.lcd.height=2400"
              echo "hw.lcd.density=440"
            } > "$CFG"
            echo "fallback config: $CFG (image.sysdir.1=system-images/$IMGREL/ tag=$TAGID)"
            echo "::notice title=androv3::avdmode=handcrafted"
          fi
          if [ ! -f "$CFG" ]; then
            echo "::error::AVD config missing even after fallback - full avd.log:"
            cat /tmp/andro/avd.log 2>/dev/null || true
            exit 1
          fi
          echo "config: $CFG"
          RAMT="$ANDRO_RAMMB"
          if [ "$RAMT" = "auto" ]; then
            RAMT=$(( RAMMB - 2000 ))
            if [ "$RAMT" -lt 2048 ]; then RAMT=2048; fi
            if [ "$RAMT" -gt 32768 ]; then RAMT=32768; fi
          fi
          COREST=$(( CORES - 1 ))
          if [ "$COREST" -lt 2 ]; then COREST=2; fi
          {
            echo "hw.ramSize=$RAMT"
            echo "disk.dataPartition.size=192G"
            echo "hw.lcd.width=1080"
            echo "hw.lcd.height=2400"
            echo "hw.lcd.density=440"
            echo "hw.cpu.ncore=$COREST"
            echo "hw.keyboard=yes"
            echo "hw.audioInput=yes"
            echo "hw.audioOutput=yes"
          } >> "$CFG"
          {
            echo "PHONERAM=$RAMT"
            echo "PHONECORES=$COREST"
          } >> "$GITHUB_ENV"
          AVDCHK="$("/tmp/andro/sdk/emulator/emulator" -list-avds 2>/dev/null | grep -c cloudphone || true)"
          if [ "$AVDCHK" -lt 1 ]; then
            echo "::error::AVD verify failed - emulator -list-avds did not list cloudphone"
            cat "$CFG" || true
            tail -30 /tmp/andro/avd.log 2>/dev/null || true
            exit 1
          fi
          echo "::notice title=androv3::avd=verified"
          echo "Phone config: RAM=$RAMT MB cores=$COREST storage=192G sparse LCD=1080x2400@440"

      - name: "6/9 Boot Android 16 + Tweaks"
        run: |
          set -Eeuo pipefail
          ADB="/tmp/andro/sdk/platform-tools/adb"
          nohup /tmp/andro/sdk/emulator/emulator -avd cloudphone -no-window -gpu auto -no-snapshot -no-boot-anim -no-metrics > /tmp/andro/emu.log 2>&1 &
          echo $! > /tmp/andro/emu.pid
          echo "emulator starting (pehli baar 3-10 min)..."
          "$ADB" start-server > /dev/null 2>&1 || true
          ok=""
          for i in $(seq 1 60); do
            if [ "$("$ADB" shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = "1" ]; then ok=1; break; fi
            if ! kill -0 "$(cat /tmp/andro/emu.pid)" 2>/dev/null; then
              echo "::error::emulator process died - logs:"
              tail -40 /tmp/andro/emu.log || true
              exit 1
            fi
            if [ $((i % 6)) -eq 0 ]; then echo "boot wait: $((i * 20))s..."; fi
            sleep 20
          done
          if [ -z "$ok" ]; then
            echo "::error::Android boot timeout (20 min)"
            tail -40 /tmp/andro/emu.log || true
            exit 1
          fi
          echo "::notice::Android 16 BOOTED"
          "$ADB" shell svc power stayon true
          "$ADB" shell settings put global window_animation_scale 0.0
          "$ADB" shell settings put global transition_animation_scale 0.0
          "$ADB" shell settings put global animator_duration_scale 0.0
          "$ADB" shell settings put global stay_on_while_plugged_in 7
          "$ADB" shell settings put secure user_setup_complete 1
          "$ADB" shell settings put global device_provisioned 1
          "$ADB" shell settings put system screen_off_timeout 2147460000

      - name: "7/9 Stream Stack (relay + scrcpy + proxy)"
        env:
          IN_USER: ${{ inputs.auth_username }}
          IN_PASS: ${{ inputs.auth_password }}
        run: |
          set -Eeuo pipefail
          printf '%s' '' | base64 -d > /tmp/andro/relay.js
          printf '%s' '' | base64 -d > /tmp/andro/client.html
          printf '%s' '' | base64 -d > /tmp/andro/proxy.js
          node --check /tmp/andro/relay.js && node --check /tmp/andro/proxy.js
          echo "Downloading scrcpy-server v5.0.1..."
          curl -fsSL --retry 3 -o /tmp/andro/scrcpy-server "https://github.com/Genymobile/scrcpy/releases/download/v5.0.1/scrcpy-server-v5.0.1"
          if [ -n "$IN_USER" ] && [ -n "$IN_PASS" ]; then
            AUTH_MODE="CUSTOM"
            AUTH_USER="$IN_USER"
            AUTH_PASS="$IN_PASS"
            echo "::add-mask::$AUTH_PASS"
            ULEN="$(printf '%s' "$AUTH_USER" | wc -c | tr -d ' ')"
            PLEN="$(printf '%s' "$AUTH_PASS" | wc -c | tr -d ' ')"
            if [ "$ULEN" -lt 3 ]; then echo "::error::Auth username must be at least 3 characters (got $ULEN)"; exit 1; fi
            if [ "$PLEN" -lt 8 ]; then echo "::error::Auth password must be at least 8 characters (got $PLEN)"; exit 1; fi
            if ! printf '%s' "$AUTH_PASS" | grep -q '[A-Z]'; then echo "::error::password needs at least one UPPERCASE letter"; exit 1; fi
            if ! printf '%s' "$AUTH_PASS" | grep -q '[a-z]'; then echo "::error::password needs at least one lowercase letter"; exit 1; fi
            if ! printf '%s' "$AUTH_PASS" | grep -q '[0-9]'; then echo "::error::password needs at least one digit"; exit 1; fi
            echo "::notice::CUSTOM credentials accepted (masked in logs)"
          else
            AUTH_MODE="TEMPORARY"
            AUTH_USER="admin"
            GEN="$(openssl rand -base64 30 | tr -dc 'A-Za-z0-9' | head -c 13)"
            AUTH_PASS="$(printf '%sXy9' "$GEN")"
            echo "::notice::TEMPORARY credentials generated - Summary mein dikhenge"
          fi
          echo "::add-mask::$AUTH_PASS"
          {
            echo "AUTH_USER=$AUTH_USER"
            echo "AUTH_PASS=$AUTH_PASS"
            echo "AUTH_MODE=$AUTH_MODE"
          } >> "$GITHUB_ENV"
          export PORT=8090
          export ADB="/tmp/andro/sdk/platform-tools/adb"
          export LOCAL_JAR=/tmp/andro/scrcpy-server
          export SCRCPY_VERSION=5.0.1
          export MAX_SIZE="$ANDRO_MAXSIZE"
          export BIT_RATE="$ANDRO_BITRATE"
          export MAX_FPS="$ANDRO_FPS"
          export AUDIO=1
          export AUDIO_CODEC=opus
          nohup node /tmp/andro/relay.js > /tmp/andro/relay.log 2>&1 &
          echo $! > /tmp/andro/relay.pid
          export AUTH_USER="$AUTH_USER"
          export AUTH_PASS="$AUTH_PASS"
          export UPSTREAM_PORT=8090
          export LISTEN_PORT=8080
          nohup node /tmp/andro/proxy.js > /tmp/andro/proxy.log 2>&1 &
          echo $! > /tmp/andro/proxy.pid
          sleep 3
          code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 5 http://127.0.0.1:8080/ || true)"
          if [ "$code" != "401" ]; then
            echo "::error::proxy no-creds challenge fail (expected 401, got: $code)"
            tail -25 /tmp/andro/proxy.log 2>/dev/null || true
            exit 1
          fi
          code2="$(curl -s -o /dev/null -w '%{http_code}' --max-time 8 -u "$AUTH_USER:$AUTH_PASS" http://127.0.0.1:8080/ || true)"
          if [ "$code2" != "200" ]; then
            echo "::error::proxy->relay chain broken (got: $code2)"
            tail -25 /tmp/andro/relay.log 2>/dev/null || true
            exit 1
          fi
          echo "::notice::Stream stack UP: no-creds=401, with-creds=200"

      - name: "8/9 Tunnels (Cloudflare + ngrok)"
        env:
          NGROK_SECRET: ${{ secrets.NGROK_AUTHTOKEN }}
          NGROK_INPUT: ${{ inputs.ngrok_authtoken }}
        run: |
          set -Eeuo pipefail
          NGROK_AUTHTOKEN="$NGROK_INPUT"
          if [ -z "$NGROK_AUTHTOKEN" ]; then NGROK_AUTHTOKEN="$NGROK_SECRET"; fi
          if [ -n "$NGROK_AUTHTOKEN" ]; then echo "::add-mask::$NGROK_AUTHTOKEN"; fi
          CF_URL=""
          NGROK_URL=""
          case "$(uname -m)" in
            x86_64) TARCH="amd64" ;;
            aarch64|arm64) TARCH="arm64" ;;
            *) TARCH="amd64" ;;
          esac
          if [ "$ENABLE_CF" = "1" ]; then
            echo "Starting Cloudflare quick tunnel..."
            curl -fsSL --retry 3 --max-time 120 -o /tmp/andro/cf.tgz "https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-$TARCH.tgz" || true
            if [ -s /tmp/andro/cf.tgz ]; then
              tar -xzf /tmp/andro/cf.tgz -C /tmp/andro && chmod +x /tmp/andro/cloudflared
              nohup /tmp/andro/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 > /tmp/andro/cf.log 2>&1 &
              echo $! > /tmp/andro/cf.pid
              for i in $(seq 1 45); do
                CF_URL="$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/andro/cf.log | head -1 || true)"
                if [ -n "$CF_URL" ]; then break; fi
                sleep 2
              done
            else
              echo "::warning::cloudflared download failed"
            fi
          fi
          if [ "$ENABLE_NGROK" = "1" ]; then
            if [ -z "$NGROK_AUTHTOKEN" ]; then
              echo "::warning::ngrok token missing (input + secret dono khali) - ngrok skipped"
            else
              echo "Starting ngrok tunnel..."
              curl -fsSL --retry 3 --max-time 120 -o /tmp/andro/ngrok.zip "https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-$TARCH.zip" || true
              if [ -s /tmp/andro/ngrok.zip ]; then
                mkdir -p /tmp/andro/ngrokbin && unzip -o /tmp/andro/ngrok.zip -d /tmp/andro/ngrokbin > /dev/null
                NGROK_BIN="/tmp/andro/ngrokbin/ngrok"
                chmod +x "$NGROK_BIN"
                "$NGROK_BIN" config add-authtoken "$NGROK_AUTHTOKEN"
                nohup "$NGROK_BIN" http 8080 --log stdout > /tmp/andro/ngrok.log 2>&1 &
                echo $! > /tmp/andro/ngrok.pid
                for i in $(seq 1 30); do
                  NGROK_URL="$(curl -s --max-time 3 http://127.0.0.1:4040/api/tunnels | grep -o '"public_url":"https://[^"]*"' | head -1 | cut -d'"' -f4 || true)"
                  if [ -n "$NGROK_URL" ]; then break; fi
                  sleep 2
                done
              else
                echo "::warning::ngrok download failed"
              fi
            fi
          fi
          if [ -z "$CF_URL" ] && [ -z "$NGROK_URL" ]; then
            echo "::error::NO tunnel came up - dumping tunnel logs"
            tail -30 /tmp/andro/cf.log 2>/dev/null || true
            tail -30 /tmp/andro/ngrok.log 2>/dev/null || true
            exit 1
          fi
          {
            echo "CF_URL=$CF_URL"
            echo "NGROK_URL=$NGROK_URL"
          } >> "$GITHUB_ENV"
          PRIMARY="$CF_URL"
          if [ -z "$PRIMARY" ]; then PRIMARY="$NGROK_URL"; fi
          echo "::notice::TUNNELS UP -> $PRIMARY"

      - name: "9/9 Publish Summary + Credentials"
        run: |
          set -Eeuo pipefail
          PRIMARY="$CF_URL"
          if [ -z "$PRIMARY" ]; then PRIMARY="$NGROK_URL"; fi
          {
            echo "## ANDRO CLOUD - Android 16 Phone LIVE"
            echo ""
            if [ -n "$CF_URL" ]; then echo "**Cloudflare URL:** $CF_URL"; echo ""; fi
            if [ -n "$NGROK_URL" ]; then echo "**ngrok URL:** $NGROK_URL (free plan: pehle Visit Site click karo)"; echo ""; fi
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Primary URL | $PRIMARY |"
            echo "| Username | **$AUTH_USER** |"
            echo "| Password | **$AUTH_PASS** |"
            echo "| Android | $ANDRO_IMG |"
            echo "| Phone RAM | $PHONERAM MB |"
            echo "| Phone Cores | $PHONECORES |"
            echo "| Storage | sparse 192G (jitni host disk khali) |"
            echo "| Stream | $(if [ "$ANDRO_MAXSIZE" = "0" ]; then echo native; else echo "$ANDRO_MAXSIZE px"; fi) / $ANDRO_BITRATE bps / $ANDRO_FPS fps (H.264 WebCodecs + Opus audio + clipboard sync + MJPG fallback) |"
            echo "| Edge proxy | 127.0.0.1:8080 (Basic-Auth + session cookie) |"
            echo ""
            echo "### Phone chalane ka tarika"
            echo "1. URL mobile browser mein kholo -> auth popup -> username + password (sirf ek baar)"
            echo "2. Phone screen FIXED dikhega - touch seedha Android mein jayega, page scroll nahi hoga"
            echo "3. Toolbar: Home/Back/Recents/Volume/Power/Rotate + COPY/PASTE/Keyboard/Audio/Quality (V2)"
            echo "4. Play Store image = Google sign-in karke apps install kar sakte ho"
            echo "5. V2: Audio live (speaker icon) | Clipboard copy/paste | Keyboard icon se type karo (mobile keyboard se)"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::ANDROID 16 PHONE LIVE -> $PRIMARY | login: $AUTH_USER"
          echo "::notice title=androv3::cf=$CF_URL"
          echo "::notice title=androv3::ng=$NGROK_URL"
          echo "::notice title=androv3::user=$AUTH_USER"
          echo "::notice title=androv3::mode=$AUTH_MODE"
          if [ "$AUTH_MODE" = "TEMPORARY" ]; then
            echo "::notice title=androv3::pass=$AUTH_PASS"
          fi
          echo "::notice title=androv3::live=1"

      - name: "Failure Diagnostics (auto)"
        if: failure()
        run: |
          echo "=== EMULATOR LOG (tail 40) ==="; tail -40 /tmp/andro/emu.log 2>/dev/null || true
          echo "=== KVM ==="; ls -la /dev/kvm 2>/dev/null || echo "no /dev/kvm"
          echo "=== RELAY ==="; tail -30 /tmp/andro/relay.log 2>/dev/null || true
          echo "=== PROXY ==="; tail -20 /tmp/andro/proxy.log 2>/dev/null || true
          echo "=== ADB DEVICES ==="; /tmp/andro/sdk/platform-tools/adb devices 2>/dev/null || true
          echo "=== TUNNELS ==="; tail -20 /tmp/andro/cf.log 2>/dev/null || true; tail -20 /tmp/andro/ngrok.log 2>/dev/null || true
          echo "=== DISK ==="; df -h / | tail -1

      - name: "Keep Alive (auto-heal, ~5.8h hosted)"
        run: |
          set -Eeuo pipefail
          ADB="/tmp/andro/sdk/platform-tools/adb"
          i=0
          while [ "$i" -lt 335 ]; do
            i=$((i + 1))
            if ! kill -0 "$(cat /tmp/andro/emu.pid)" 2>/dev/null; then
              echo "::warning::min $i: emulator down - restarting"
              nohup /tmp/andro/sdk/emulator/emulator -avd cloudphone -no-window -gpu auto -no-snapshot -no-boot-anim -no-metrics >> /tmp/andro/emu.log 2>&1 &
              echo $! > /tmp/andro/emu.pid
              sleep 40
            fi
            if ! curl -s -o /dev/null --max-time 5 http://127.0.0.1:8090/health; then
              echo "::warning::min $i: relay down - restarting"
              export PORT=8090
              export LOCAL_JAR=/tmp/andro/scrcpy-server
              export SCRCPY_VERSION=5.0.1
              export MAX_SIZE="$ANDRO_MAXSIZE"
              export BIT_RATE="$ANDRO_BITRATE"
              export MAX_FPS="$ANDRO_FPS"
              export AUDIO=1
              export AUDIO_CODEC=opus
              nohup node /tmp/andro/relay.js >> /tmp/andro/relay.log 2>&1 &
              echo $! > /tmp/andro/relay.pid
              sleep 3
            fi
            if ! curl -s -o /dev/null --max-time 5 http://127.0.0.1:8080/; then
              echo "::warning::min $i: proxy down - restarting"
              export UPSTREAM_PORT=8090
              export LISTEN_PORT=8080
              nohup node /tmp/andro/proxy.js >> /tmp/andro/proxy.log 2>&1 &
              echo $! > /tmp/andro/proxy.pid
              sleep 3
            fi
            if [ "$ENABLE_CF" = "1" ] && ! pgrep -f "cloudflared tunnel" > /dev/null 2>&1; then
              echo "::warning::min $i: cloudflared down - restarting (URL change ho jayega)"
              nohup /tmp/andro/cloudflared tunnel --no-autoupdate --url http://127.0.0.1:8080 >> /tmp/andro/cf.log 2>&1 &
              sleep 10
              NEWURL="$(grep -o 'https://[a-z0-9-]*\.trycloudflare\.com' /tmp/andro/cf.log | tail -1 || true)"
              if [ -n "$NEWURL" ]; then echo "::notice::NEW Cloudflare URL -> $NEWURL"; fi
            fi
            if [ $((i % 30)) -eq 0 ]; then echo "keep-alive: $i/335 min - phone + tunnels alive"; fi
            sleep 60
          done
